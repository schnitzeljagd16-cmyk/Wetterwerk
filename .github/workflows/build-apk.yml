name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Wetterwerk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wetterwerk-APK
          path: Wetterwerk.apk

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neueste
          name: Wetterwerk (neueste Version)
          body: Wetterwerk.apk antippen, herunterladen und installieren. Neue Versionen lassen sich einfach über die alte installieren.
          files: Wetterwerk.apk
          make_latest: true
